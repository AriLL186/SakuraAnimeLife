name: Build Sakura Anime Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK
      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Check Android SDK
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Extract Game Source
      - name: Extract Game Source
        run: |
          unzip -o project-source.zip -d .

      # 8. Build Sakura Anime Life APK
      - name: Build Sakura Anime Life APK
        working-directory: SakuraAnimeLife
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
        run: |
          unset JAVA_OPTS
          unset GRADLE_OPTS
          gradle --no-daemon assembleDebug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-Anime-Life-APK
          path: SakuraAnimeLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
