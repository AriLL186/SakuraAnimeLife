
name: Build Sakura Anime Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK Components
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Extract Game Source
      - name: Extract Game Source
        run: |
          unzip -o project-source.zip -d .

      # 6. Fix Gradle Properties Automatically
      - name: Fix Gradle Configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("SakuraAnimeLife/gradle.properties")

          lines = []
          if p.exists():
              lines = p.read_text().splitlines()

          lines = [
              line for line in lines
              if not line.strip().startswith("org.gradle.jvmargs")
          ]

          if not any(
              line.strip().startswith("android.useAndroidX=")
              for line in lines
          ):
              lines.append("android.useAndroidX=true")

          lines.append(
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
          )

          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("\n".join(lines) + "\n")

          print("Gradle configuration repaired:")
          print(p.read_text())
          PY

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Build APK
      - name: Build Sakura Anime Life APK
        working-directory: SakuraAnimeLife
        run: |
          gradle --no-daemon assembleDebug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-Anime-Life-APK
          path: SakuraAnimeLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
