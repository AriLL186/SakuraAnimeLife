
name: Build Sakura Anime Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Gradle Files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("SakuraAnimeLife")

          if not root.exists():
              raise SystemExit("Folder SakuraAnimeLife tidak ditemukan!")

          for p in root.rglob("*"):
              if p.is_file() and (
                  p.name in ("build.gradle", "settings.gradle")
                  or p.name.endswith(".gradle.kts")
              ):
                  s = p.read_text()
                  p.write_text(s.replace(r"\n", "\n"))

          p = root / "settings.gradle"
          p.write_text("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SakuraAnimeLife"
          include(":app")
          """)

          (root / "gradle.properties").write_text(
              "android.useAndroidX=true\n"
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
              "org.gradle.parallel=true\n"
              "org.gradle.caching=true\n"
          )
          PY

      - name: Build APK
        working-directory: SakuraAnimeLife
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-Anime-Life-APK
          path: SakuraAnimeLife/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
